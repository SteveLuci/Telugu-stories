<!DOCTYPE html>
<html lang="te" data-theme="sepia">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Akshara Lokam</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f6efe2;
      --text: #2c241b;
      --card: #efe4cf;
      --accent: #7a3e1d;
    }
    [data-theme="dark"] {
      --bg: #141416;
      --text: #eae6df;
      --card: #1f2024;
      --accent: #e09f67;
    }
    body {
      margin: 0;
      font-family: "Noto Sans Telugu", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.8;
    }
    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 2rem 1.25rem 4rem;
    }
    header, footer {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }
    nav {
      margin: 1rem 0;
    }
    nav a, footer a {
      margin-right: 1rem;
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
    button {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--accent);
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
    }
    .meta-bar {
      background: var(--card);
      padding: 0.9rem 1.15rem;
      border-radius: 8px;
      margin-top: 1rem;
      font-size: 0.95rem;
    }
    .chapter-card {
      background: var(--card);
      padding: 1.25rem;
      border-radius: 10px;
      margin-top: 1.25rem;
    }
    .chapter-card a {
      color: var(--accent);
      font-weight: 700;
      text-decoration: none;
      font-size: 1.15rem;
    }
    footer {
      margin-top: 3rem;
      padding-top: 1rem;
      border-top: 1px solid rgba(122, 62, 29, 0.25);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1 id="site-title">Akshara Lokam</h1>
        <p id="series-subtitle">Loading series...</p>
      </div>
      <button id="theme-toggle" type="button">Dark Mode</button>
    </header>

    <nav>
      <a href="index.html">Chapters</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      <a href="privacy.html">Privacy Policy</a>
    </nav>

    <!-- AdSense responsive slot placeholder -->
    <div id="ad-slot-top"></div>

    <div id="series-meta" class="meta-bar" style="display:none;"></div>
    <main id="chapter-list"></main>

    <footer>
      <span>&copy; Akshara Lokam</span>
      <div>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="privacy.html">Privacy Policy</a>
      </div>
    </footer>
  </div>

  <script>
    const root = document.documentElement;
    const toggleBtn = document.getElementById("theme-toggle");
    const savedTheme = localStorage.getItem("theme") || "sepia";
    root.setAttribute("data-theme", savedTheme);
    toggleBtn.textContent = savedTheme === "dark" ? "Sepia Mode" : "Dark Mode";

    toggleBtn.addEventListener("click", () => {
      const next = root.getAttribute("data-theme") === "dark" ? "sepia" : "dark";
      root.setAttribute("data-theme", next);
      localStorage.setItem("theme", next);
      toggleBtn.textContent = next === "dark" ? "Sepia Mode" : "Dark Mode";
    });

    async function loadChapters() {
      try {
        const [configRes, stateRes, storiesRes] = await Promise.all([
          fetch("story_config.json"),
          fetch("series_state.json"),
          fetch("stories.json")
        ]);
        const config = configRes.ok ? await configRes.json() : {};
        const state = stateRes.ok ? await stateRes.json() : {};
        const stories = storiesRes.ok ? await storiesRes.json() : {};

        if (config.site_title) {
          document.title = config.site_title;
          document.getElementById("site-title").textContent = config.site_title;
        }
        document.getElementById("series-subtitle").textContent = state.series_title || "";

        const metaEl = document.getElementById("series-meta");
        if (state.city || state.state) {
          metaEl.style.display = "block";
          metaEl.textContent = `Series ${state.active_series_number || 1} · ${state.city || ""}, ${state.state || ""}`;
        }

        const seriesList = stories.series || [];
        const activeSeries =
          seriesList.find(s => s.series_number === state.active_series_number) ||
          seriesList[seriesList.length - 1] ||
          { chapters: [] };

        const chapters = [...(activeSeries.chapters || [])].reverse();
        const listEl = document.getElementById("chapter-list");

        if (!chapters.length) {
          listEl.innerHTML = "<p>First chapter arrives at 7:00 AM daily.</p>";
          return;
        }

        const sNum = activeSeries.series_number || state.active_series_number || 1;
        listEl.innerHTML = chapters.map(ch => `
          <article class="chapter-card">
            <a href="story.html?series=${sNum}&ch=${ch.chapter}">Chapter ${ch.chapter}: ${ch.title}</a>
            <p>${ch.excerpt}</p>
          </article>
        `).join("");
      } catch (err) {
        document.getElementById("chapter-list").innerHTML = "<p>Unable to load chapters right now.</p>";
      }
    }
    loadChapters();
  </script>
</body>
</html>
