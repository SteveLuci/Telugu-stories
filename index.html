<!DOCTYPE html>
<html lang="te" data-theme="sepia">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Akshara Lokam — అక్షర లోకం</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,700;1,6..72,500&family=Noto+Sans+Telugu:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f7f1e5;
      --surface: #fffdf8;
      --surface-alt: #f0e5d1;
      --text: #241c14;
      --muted: #685848;
      --accent: #9a3b1b;
      --accent-soft: rgba(154, 59, 27, 0.12);
      --danger: #b42318;
      --success: #166534;
      --border: rgba(110, 72, 42, 0.16);
      --shadow: 0 10px 30px rgba(45, 26, 10, 0.06);
      --container-max: 1020px;
      --font-scale: 1;

      /* Customizable Genre Sidebar Variables */
      --genre-sidebar-w: 210px;
      --genre-btn-fs: 0.86rem;
      --genre-btn-py: 0.52rem;
      --genre-btn-px: 0.85rem;
      --genre-btn-radius: 10px;
    }

    [data-theme="dark"] {
      --bg: #111215;
      --surface: #181a1f;
      --surface-alt: #20232a;
      --text: #f0ece4;
      --muted: #a69f93;
      --accent: #e59d5c;
      --accent-soft: rgba(229, 157, 92, 0.15);
      --danger: #f97066;
      --success: #4ade80;
      --border: rgba(255, 255, 255, 0.1);
      --shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Noto Sans Telugu", "Plus Jakarta Sans", sans-serif;
      font-size: calc(16px * var(--font-scale));
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.85;
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      max-width: var(--container-max);
      margin: 0 auto;
      padding: 2rem 1.25rem 4rem;
    }

    .top-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--border);
    }

    .brand-eyebrow {
      font-family: "Plus Jakarta Sans", "Noto Sans Telugu", sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 700;
      margin-bottom: 0.25rem;
    }

    .site-title {
      margin: 0;
      font-family: "Newsreader", "Noto Sans Telugu", serif;
      font-size: clamp(1.85rem, 4vw, 2.5rem);
      line-height: 1.2;
      font-weight: 700;
    }

    .header-actions {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .nav-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem 1.1rem;
      margin: 1.15rem 0 1.5rem;
    }

    .nav-group a {
      color: var(--muted);
      text-decoration: none;
      font-family: "Plus Jakarta Sans", "Noto Sans Telugu", sans-serif;
      font-size: 0.92rem;
      font-weight: 600;
      padding: 0.25rem 0;
      border-bottom: 2px solid transparent;
    }

    .nav-group a:hover, .nav-group a.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    /* Main Content + Left Genre Sidebar Layout */
    .workspace-layout {
      display: grid;
      grid-template-columns: var(--genre-sidebar-w) minmax(0, 1fr);
      gap: 1.5rem;
      align-items: start;
    }

    body.no-genre-sidebar .workspace-layout {
      grid-template-columns: minmax(0, 1fr);
    }
    body.no-genre-sidebar .genre-sidebar {
      display: none;
    }

    .genre-sidebar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1rem 0.85rem;
      box-shadow: var(--shadow);
      position: sticky;
      top: 1.25rem;
    }

    .genre-sidebar-heading {
      font-family: "Plus Jakarta Sans", "Noto Sans Telugu", sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
      margin: 0 0 0.65rem 0.25rem;
    }

    .genre-list {
      display: flex;
      flex-direction: column;
      gap: 0.42rem;
    }

    .genre-btn {
      width: 100%;
      text-align: left;
      background: var(--surface-alt);
      color: var(--text);
      border: 1px solid var(--border);
      padding: var(--genre-btn-py) var(--genre-btn-px);
      border-radius: var(--genre-btn-radius);
      font-family: "Plus Jakarta Sans", "Noto Sans Telugu", sans-serif;
      font-size: var(--genre-btn-fs);
      font-weight: 600;
      line-height: 1.35;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .genre-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateX(2px);
    }

    .genre-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    [data-theme="dark"] .genre-btn.active { color: #111215; }

    .genre-divider {
      height: 1px;
      background: var(--border);
      margin: 0.35rem 0;
    }

    @media (max-width: 760px) {
      .workspace-layout {
        grid-template-columns: minmax(0, 1fr);
      }
      .genre-sidebar {
        position: static;
      }
      .genre-list {
        flex-direction: row;
        flex-wrap: wrap;
      }
      .genre-btn {
        width: auto;
      }
      .genre-divider {
        width: 100%;
        height: 1px;
      }
    }

    .btn {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.48rem 0.95rem;
      border-radius: 999px;
      font-family: "Plus Jakarta Sans", "Noto Sans Telugu", sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: transform 0.15s ease, border-color 0.2s ease;
    }

    .btn:hover { transform: translateY(-1px); border-color: var(--accent); }
    .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    [data-theme="dark"] .btn-primary { color: #111215; }
    .btn-danger { color: var(--danger); border-color: var(--danger); }
    .btn-sm { padding: 0.3rem 0.7rem; font-size: 0.78rem; border-radius: 8px; }

    .studio-panel {
      display: none;
      background: var(--surface);
      border: 2px solid var(--accent);
      border-radius: 16px;
      padding: 1.35rem 1.5rem;
      margin-bottom: 1.75rem;
      box-shadow: var(--shadow);
    }
    body.editing .studio-panel { display: block; }

    .studio-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .studio-title {
      margin: 0;
      font-family: "Plus Jakarta Sans", sans-serif;
      font-size: 1rem;
      font-weight: 700;
      color: var(--accent);
    }

    .tab-row {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
    }

    .tab-pane { display: none; }
    .tab-pane.active { display: block; }

    .studio-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 0.85rem;
      margin-bottom: 0.9rem;
    }

    .preset-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 0.9rem;
    }

    .toggle-row {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin: 0.6rem 0 0.9rem;
      font-family: "Plus Jakarta Sans", sans-serif;
      font-size: 0.85rem;
    }

    .toggle-row label {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      cursor: pointer;
    }

    .toggle-row input[type="checkbox"] { width: auto; }

    label.field {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      font-family: "Plus Jakarta Sans", "Noto Sans Telugu", sans-serif;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
    }

    input, textarea, select {
      width: 100%;
      background: var(--surface-alt);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.55rem 0.75rem;
      font-family: "Noto Sans Telugu", "Plus Jakarta Sans", sans-serif;
      font-size: 0.92rem;
    }

    input[type="color"] {
      padding: 0.2rem;
      height: 40px;
      cursor: pointer;
    }

    textarea { min-height: 110px; line-height: 1.7; resize: vertical; }

    .status-msg {
      font-family: "Plus Jakarta Sans", sans-serif;
      font-size: 0.84rem;
      font-weight: 600;
      margin-top: 0.65rem;
    }

    .hero-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem 1.65rem;
      box-shadow: var(--shadow);
      margin-bottom: 2rem;
    }

    .series-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 0.82rem;
      font-weight: 700;
      padding: 0.28rem 0.75rem;
      border-radius: 999px;
      margin-bottom: 0.75rem;
    }

    .series-heading { margin: 0 0 0.4rem; font-size: clamp(1.3rem, 3vw, 1.7rem); font-weight: 700; }
    .series-location { color: var(--muted); font-size: 0.95rem; margin: 0 0 0.85rem; }

    .char-chips { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.75rem; }
    .char-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.35rem 0.7rem;
      font-size: 0.85rem;
    }

    .chip-remove {
      display: none;
      background: none;
      border: none;
      color: var(--danger);
      font-weight: 700;
      cursor: pointer;
      padding: 0 0.2rem;
    }
    body.editing .chip-remove { display: inline; }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.9rem;
    }

    .section-label {
      font-family: "Plus Jakarta Sans", "Noto Sans Telugu", sans-serif;
      font-size: 0.82rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
    }

    .chapter-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.35rem 1.5rem;
      margin-bottom: 1rem;
      box-shadow: var(--shadow);
      transition: transform 0.18s ease, border-color 0.2s ease;
    }
    .chapter-card:hover { border-color: var(--accent); }

    .chapter-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.45rem;
      flex-wrap: wrap;
    }

    .badge-group { display: flex; gap: 0.45rem; align-items: center; flex-wrap: wrap; }

    .chapter-num {
      font-family: "Plus Jakarta Sans", sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 0.2rem 0.65rem;
      border-radius: 6px;
    }

    .cat-tag {
      font-family: "Plus Jakarta Sans", sans-serif;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--muted);
      background: var(--surface-alt);
      border: 1px solid var(--border);
      padding: 0.18rem 0.6rem;
      border-radius: 6px;
    }

    .chapter-link { text-decoration: none; color: inherit; display: block; }
    .chapter-title { margin: 0.25rem 0 0.4rem; font-size: 1.22rem; font-weight: 700; }
    .chapter-excerpt { margin: 0; color: var(--muted); font-size: 0.98rem; }
    body.hide-excerpts .chapter-excerpt { display: none; }

    .edit-controls {
      display: none;
      gap: 0.5rem;
      margin-top: 1rem;
      padding-top: 0.85rem;
      border-top: 1px dashed var(--border);
    }
    body.editing .edit-controls { display: flex; flex-wrap: wrap; }

    .edit-only { display: none; }
    body.editing .edit-only { display: block; }

    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 50;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      max-width: 680px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 1.5rem;
      box-shadow: var(--shadow);
    }

    footer {
      margin-top: 3.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      font-size: 0.9rem;
      color: var(--muted);
    }
    footer a { color: var(--muted); text-decoration: none; margin-left: 1rem; font-weight: 600; }
    footer a:hover { color: var(--accent); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top-bar">
      <div>
        <div id="brand-eyebrow" class="brand-eyebrow">Daily Telugu Serial Fiction</div>
        <h1 id="site-title" class="site-title">Akshara Lokam</h1>
      </div>
      <div class="header-actions">
        <button id="edit-toggle" class="btn" type="button">Edit Mode</button>
        <button id="theme-toggle" class="btn" type="button">Dark Mode</button>
      </div>
    </div>

    <nav class="nav-group" aria-label="Main navigation">
      <a class="active" href="index.html">Chapters</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      <a href="privacy.html">Privacy Policy</a>
    </nav>

    <!-- WordPress-Style Studio & Customizer Panel -->
    <section class="studio-panel" aria-label="WordPress Style Customizer and Editor">
      <div class="studio-header">
        <h2 class="studio-title">Akshara Lokam Studio</h2>
        <div style="display:flex; gap:0.5rem; flex-wrap:wrap;">
          <button id="download-json-btn" class="btn btn-sm" type="button">Download JSON Files</button>
          <button id="publish-github-btn" class="btn btn-primary btn-sm" type="button">Save &amp; Publish to GitHub</button>
        </div>
      </div>

      <div class="tab-row" role="tablist">
        <button class="btn btn-sm btn-primary" data-tab="tab-content" type="button">Story &amp; Series</button>
        <button class="btn btn-sm" data-tab="tab-customize" type="button">Customize Design &amp; Genres</button>
        <button class="btn btn-sm" data-tab="tab-publish" type="button">GitHub Connection</button>
      </div>

      <div id="tab-content" class="tab-pane active">
        <div class="studio-grid">
          <label class="field">
            Series Title
            <input id="edit-series-title" type="text" />
          </label>
          <label class="field">
            City / Town
            <input id="edit-city" type="text" />
          </label>
          <label class="field">
            State
            <input id="edit-state" type="text" />
          </label>
        </div>
        <label class="field">
          Plot Memory (guides next AI chapter)
          <textarea id="edit-plot-memory" style="min-height:70px;"></textarea>
        </label>
      </div>

      <div id="tab-customize" class="tab-pane">
        <div class="preset-row">
          <button class="btn btn-sm" type="button" onclick="applyPreset('parchment')">Warm Parchment</button>
          <button class="btn btn-sm" type="button" onclick="applyPreset('terracotta')">Godavari Terracotta</button>
          <button class="btn btn-sm" type="button" onclick="applyPreset('palm')">Palm Leaf</button>
          <button class="btn btn-sm" type="button" onclick="applyPreset('night')">Night Lamp</button>
        </div>

        <div class="studio-grid">
          <label class="field">
            Site Title
            <input id="cust-site-title" type="text" />
          </label>
          <label class="field">
            Header Eyebrow Tagline
            <input id="cust-eyebrow" type="text" />
          </label>
          <label class="field">
            Footer Credit Text
            <input id="cust-footer-text" type="text" />
          </label>
        </div>

        <div class="studio-grid">
          <label class="field">
            Accent Color
            <input id="cust-accent" type="color" value="#9a3b1b" />
          </label>
          <label class="field">
            Background Color
            <input id="cust-bg" type="color" value="#f7f1e5" />
          </label>
          <label class="field">
            Font Size Scale
            <select id="cust-font-scale">
              <option value="0.95">Compact (95%)</option>
              <option value="1">Standard (100%)</option>
              <option value="1.1">Comfortable (110%)</option>
              <option value="1.2">Large Reader (120%)</option>
            </select>
          </label>
          <label class="field">
            Page Width
            <select id="cust-max-width">
              <option value="860px">Medium (860px)</option>
              <option value="1020px">Editorial Wide (1020px)</option>
              <option value="1160px">Full Wide (1160px)</option>
            </select>
          </label>
        </div>

        <div class="section-label" style="margin-top:1rem;">Left Genre Section Controls</div>
        <div class="studio-grid">
          <label class="field">
            Genre Sidebar Width
            <select id="cust-genre-width">
              <option value="175px">Slim (175px)</option>
              <option value="210px">Standard (210px)</option>
              <option value="255px">Wide (255px)</option>
            </select>
          </label>
          <label class="field">
            Genre Button Font Size
            <select id="cust-genre-fs">
              <option value="0.78rem">Small (0.78rem)</option>
              <option value="0.86rem">Medium (0.86rem)</option>
              <option value="0.96rem">Large (0.96rem)</option>
              <option value="1.05rem">Extra Large (1.05rem)</option>
            </select>
          </label>
          <label class="field">
            Genre Button Size / Spacing
            <select id="cust-genre-pad">
              <option value="0.35rem 0.65rem">Compact</option>
              <option value="0.52rem 0.85rem">Comfortable</option>
              <option value="0.72rem 1rem">Spacious</option>
            </select>
          </label>
          <label class="field">
            Genre Button Corners
            <select id="cust-genre-radius">
              <option value="6px">Sharp (6px)</option>
              <option value="10px">Rounded (10px)</option>
              <option value="999px">Pill (999px)</option>
            </select>
          </label>
        </div>

        <div class="studio-grid" style="align-items:end;">
          <label class="field">
            Add Custom Genre
            <input id="new-genre-name" type="text" placeholder="e.g. Horror / Comedy / Mythology" />
          </label>
          <div>
            <button id="add-genre-btn" class="btn btn-sm" type="button">+ Add Genre</button>
          </div>
        </div>

        <div class="toggle-row">
          <label><input id="cust-show-genres" type="checkbox" checked /> Show Left Genre Section</label>
          <label><input id="cust-show-hero" type="checkbox" checked /> Show Series &amp; Characters Card</label>
          <label><input id="cust-show-excerpts" type="checkbox" checked /> Show Chapter Excerpts</label>
        </div>
      </div>

      <div id="tab-publish" class="tab-pane">
        <div class="studio-grid">
          <label class="field">
            GitHub Repo (owner/repo)
            <input id="gh-repo" type="text" value="SteveLuci/Telugu-stories" />
          </label>
          <label class="field">
            Branch
            <input id="gh-branch" type="text" value="main" />
          </label>
          <label class="field">
            GitHub Token (stored only in your browser)
            <input id="gh-token" type="password" placeholder="github_pat_..." />
          </label>
        </div>
      </div>

      <div id="studio-status" class="status-msg"></div>
    </section>

    <div id="ad-slot-top"></div>

    <!-- Left Genre Sidebar + Main Story Column -->
    <div class="workspace-layout">
      <aside id="genre-sidebar" class="genre-sidebar" aria-label="Story Genres">
        <h2 class="genre-sidebar-heading">Genres</h2>
        <div id="genre-list" class="genre-list"></div>
      </aside>

      <div class="main-column">
        <section id="hero-section" class="hero-card" aria-live="polite">
          <div id="series-badge" class="series-pill">Series 1</div>
          <h2 id="series-title" class="series-heading">Loading series...</h2>
          <p id="series-location" class="series-location"></p>
          <div id="character-list" class="char-chips"></div>

          <div class="edit-only" style="margin-top:1rem; padding-top:0.9rem; border-top:1px dashed var(--border);">
            <div class="studio-grid" style="margin-bottom:0.5rem;">
              <input id="new-char-te" type="text" placeholder="Telugu Name (ఉదా: కావ్య)" />
              <input id="new-char-en" type="text" placeholder="English Name (e.g. Kavya)" />
              <input id="new-char-role" type="text" placeholder="Role (e.g. Classical singer)" />
            </div>
            <button id="add-char-btn" class="btn btn-sm" type="button">+ Add Character</button>
          </div>
        </section>

        <div class="section-head">
          <div id="section-label" class="section-label">Published Chapters</div>
          <button id="open-new-chapter-btn" class="btn btn-primary btn-sm edit-only" type="button">+ Add Chapter</button>
        </div>

        <main id="chapter-list"></main>
      </div>
    </div>

    <footer>
      <span id="footer-copy">&copy; Akshara Lokam</span>
      <div>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="privacy.html">Privacy Policy</a>
      </div>
    </footer>
  </div>

  <!-- Add / Edit Chapter Modal -->
  <div id="chapter-modal" class="modal-backdrop" role="dialog" aria-modal="true">
    <div class="modal">
      <h3 id="modal-heading" style="margin-top:0;">Add / Edit Chapter</h3>
      <div class="studio-grid">
        <label class="field">
          Chapter Number
          <input id="m-ch-num" type="number" min="1" />
        </label>
        <label class="field">
          Genre / Category
          <select id="m-ch-cat"></select>
        </label>
      </div>
      <label class="field" style="margin-bottom:0.85rem;">
        Chapter Title (Telugu / English)
        <input id="m-ch-title" type="text" />
      </label>
      <label class="field" style="margin-bottom:0.85rem;">
        Short Excerpt (shown on home card)
        <textarea id="m-ch-excerpt" style="min-height:65px;"></textarea>
      </label>
      <label class="field" style="margin-bottom:1rem;">
        Chapter Story Paragraphs (separate each paragraph with a blank line)
        <textarea id="m-ch-body" style="min-height:200px;"></textarea>
      </label>
      <div style="display:flex; justify-content:flex-end; gap:0.6rem;">
        <button id="m-cancel" class="btn" type="button">Cancel</button>
        <button id="m-save" class="btn btn-primary" type="button">Apply Changes</button>
      </div>
    </div>
  </div>

  <script>
    const root = document.documentElement;
    const themeBtn = document.getElementById("theme-toggle");
    const editBtn = document.getElementById("edit-toggle");
    const savedTheme = localStorage.getItem("theme") || "sepia";
    root.setAttribute("data-theme", savedTheme);
    themeBtn.textContent = savedTheme === "dark" ? "Sepia Mode" : "Dark Mode";

    themeBtn.addEventListener("click", () => {
      const next = root.getAttribute("data-theme") === "dark" ? "sepia" : "dark";
      root.setAttribute("data-theme", next);
      localStorage.setItem("theme", next);
      themeBtn.textContent = next === "dark" ? "Sepia Mode" : "Dark Mode";
    });

    const DEFAULT_PRIORITY_GENRES = ["Bedtime Stories", "Child Stories"];
    const DEFAULT_OTHER_GENRES = ["All Stories", "Suspense", "Thriller", "Romance", "Drama", "Mystery"];

    let appConfig = {};
    let appState = {};
    let appStories = { series: [] };
    let editingChapterIndex = null;
    let selectedCategory = "All Stories";

    document.getElementById("gh-repo").value = localStorage.getItem("ak_gh_repo") || "SteveLuci/Telugu-stories";
    document.getElementById("gh-branch").value = localStorage.getItem("ak_gh_branch") || "main";
    document.getElementById("gh-token").value = localStorage.getItem("ak_gh_token") || "";

    document.querySelectorAll("[data-tab]").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("[data-tab]").forEach(b => b.classList.remove("btn-primary"));
        document.querySelectorAll(".tab-pane").forEach(p => p.classList.remove("active"));
        btn.classList.add("btn-primary");
        document.getElementById(btn.dataset.tab).classList.add("active");
      });
    });

    function ensureCustomDesign() {
      appConfig.design = appConfig.design || {
        eyebrow: "Daily Telugu Serial Fiction",
        footer_text: "© Akshara Lokam",
        accent: "#9a3b1b",
        bg: "#f7f1e5",
        font_scale: 1,
        max_width: "1020px",
        show_genres: true,
        show_hero: true,
        show_excerpts: true,
        genre_width: "210px",
        genre_font_size: "0.86rem",
        genre_padding: "0.52rem 0.85rem",
        genre_radius: "10px"
      };
      if (!Array.isArray(appConfig.priority_genres) || !appConfig.priority_genres.length) {
        appConfig.priority_genres = [...DEFAULT_PRIORITY_GENRES];
      }
      if (!Array.isArray(appConfig.genres) || !appConfig.genres.length) {
        appConfig.genres = [...DEFAULT_OTHER_GENRES];
      }
    }

    function applyDesignToPage() {
      ensureCustomDesign();
      const d = appConfig.design;
      const title = appConfig.site_title || "Akshara Lokam";
      document.title = `${title} — అక్షర లోకం`;
      document.getElementById("site-title").textContent = title;
      document.getElementById("brand-eyebrow").textContent = d.eyebrow || "Daily Telugu Serial Fiction";
      document.getElementById("footer-copy").textContent = d.footer_text || "© Akshara Lokam";

      if (d.accent) root.style.setProperty("--accent", d.accent);
      if (d.bg && root.getAttribute("data-theme") !== "dark") {
        root.style.setProperty("--bg", d.bg);
      } else if (root.getAttribute("data-theme") === "dark") {
        root.style.removeProperty("--bg");
      }
      root.style.setProperty("--font-scale", String(d.font_scale || 1));
      root.style.setProperty("--container-max", d.max_width || "1020px");
      root.style.setProperty("--genre-sidebar-w", d.genre_width || "210px");
      root.style.setProperty("--genre-btn-fs", d.genre_font_size || "0.86rem");
      const padParts = (d.genre_padding || "0.52rem 0.85rem").split(" ");
      root.style.setProperty("--genre-btn-py", padParts[0] || "0.52rem");
      root.style.setProperty("--genre-btn-px", padParts[1] || "0.85rem");
      root.style.setProperty("--genre-btn-radius", d.genre_radius || "10px");

      const isEditing = document.body.classList.contains("editing");
      document.body.classList.toggle("no-genre-sidebar", d.show_genres === false && !isEditing);
      document.getElementById("hero-section").style.display = (d.show_hero !== false || isEditing) ? "block" : "none";
      document.body.classList.toggle("hide-excerpts", d.show_excerpts === false && !isEditing);
    }

    function renderGenreSidebarAndModalOptions() {
      ensureCustomDesign();
      const genreListEl = document.getElementById("genre-list");
      const priority = appConfig.priority_genres;
      const others = appConfig.genres;

      const makeBtn = (label) => {
        const active = selectedCategory === label ? "active" : "";
        return `<button class="genre-btn ${active}" data-cat="${label.replace(/"/g, "&quot;")}" type="button">${label}</button>`;
      };

      genreListEl.innerHTML =
        priority.map(makeBtn).join("") +
        `<div class="genre-divider" aria-hidden="true"></div>` +
        others.map(makeBtn).join("");

      genreListEl.querySelectorAll(".genre-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          selectedCategory = btn.dataset.cat;
          renderGenreSidebarAndModalOptions();
          const url = new URL(window.location.href);
          if (selectedCategory === "All Stories" || selectedCategory === "All") {
            url.searchParams.delete("category");
          } else {
            url.searchParams.set("category", selectedCategory);
          }
          window.history.replaceState({}, "", url);
          renderChapters();
        });
      });

      const selectableGenres = [...priority, ...others.filter(g => g !== "All Stories" && g !== "All")];
      const modalCatSelect = document.getElementById("m-ch-cat");
      modalCatSelect.innerHTML = selectableGenres
        .map(g => `<option value="${g.replace(/"/g, "&quot;")}">${g}</option>`)
        .join("");
    }

    document.getElementById("add-genre-btn").addEventListener("click", () => {
      const input = document.getElementById("new-genre-name");
      const name = input.value.trim();
      if (!name) return;
      ensureCustomDesign();
      if (!appConfig.genres.includes(name) && !appConfig.priority_genres.includes(name)) {
        appConfig.genres.push(name);
      }
      input.value = "";
      renderGenreSidebarAndModalOptions();
    });

    window.applyPreset = function(presetName) {
      ensureCustomDesign();
      const presets = {
        parchment: { accent: "#9a3b1b", bg: "#f7f1e5", theme: "sepia" },
        terracotta: { accent: "#8c2f1b", bg: "#f8ede6", theme: "sepia" },
        palm: { accent: "#2f6b4f", bg: "#eff5f0", theme: "sepia" },
        night: { accent: "#e59d5c", bg: "#111215", theme: "dark" }
      };
      const p = presets[presetName];
      if (!p) return;
      appConfig.design.accent = p.accent;
      appConfig.design.bg = p.bg;
      root.setAttribute("data-theme", p.theme);
      localStorage.setItem("theme", p.theme);
      themeBtn.textContent = p.theme === "dark" ? "Sepia Mode" : "Dark Mode";
      syncCustomizerInputs();
      applyDesignToPage();
    };

    function syncCustomizerInputs() {
      ensureCustomDesign();
      const d = appConfig.design;
      document.getElementById("cust-site-title").value = appConfig.site_title || "Akshara Lokam";
      document.getElementById("cust-eyebrow").value = d.eyebrow || "Daily Telugu Serial Fiction";
      document.getElementById("cust-footer-text").value = d.footer_text || "© Akshara Lokam";
      document.getElementById("cust-accent").value = d.accent || "#9a3b1b";
      document.getElementById("cust-bg").value = d.bg || "#f7f1e5";
      document.getElementById("cust-font-scale").value = String(d.font_scale || 1);
      document.getElementById("cust-max-width").value = d.max_width || "1020px";
      document.getElementById("cust-genre-width").value = d.genre_width || "210px";
      document.getElementById("cust-genre-fs").value = d.genre_font_size || "0.86rem";
      document.getElementById("cust-genre-pad").value = d.genre_padding || "0.52rem 0.85rem";
      document.getElementById("cust-genre-radius").value = d.genre_radius || "10px";
      document.getElementById("cust-show-genres").checked = d.show_genres !== false;
      document.getElementById("cust-show-hero").checked = d.show_hero !== false;
      document.getElementById("cust-show-excerpts").checked = d.show_excerpts !== false;
    }

    [
      "cust-site-title", "cust-eyebrow", "cust-footer-text", "cust-accent", "cust-bg",
      "cust-font-scale", "cust-max-width", "cust-genre-width", "cust-genre-fs",
      "cust-genre-pad", "cust-genre-radius", "cust-show-genres", "cust-show-hero",
      "cust-show-excerpts"
    ].forEach(id => {
      document.getElementById(id).addEventListener("input", () => {
        ensureCustomDesign();
        appConfig.site_title = document.getElementById("cust-site-title").value;
        appConfig.design.eyebrow = document.getElementById("cust-eyebrow").value;
        appConfig.design.footer_text = document.getElementById("cust-footer-text").value;
        appConfig.design.accent = document.getElementById("cust-accent").value;
        appConfig.design.bg = document.getElementById("cust-bg").value;
        appConfig.design.font_scale = parseFloat(document.getElementById("cust-font-scale").value || "1");
        appConfig.design.max_width = document.getElementById("cust-max-width").value;
        appConfig.design.genre_width = document.getElementById("cust-genre-width").value;
        appConfig.design.genre_font_size = document.getElementById("cust-genre-fs").value;
        appConfig.design.genre_padding = document.getElementById("cust-genre-pad").value;
        appConfig.design.genre_radius = document.getElementById("cust-genre-radius").value;
        appConfig.design.show_genres = document.getElementById("cust-show-genres").checked;
        appConfig.design.show_hero = document.getElementById("cust-show-hero").checked;
        appConfig.design.show_excerpts = document.getElementById("cust-show-excerpts").checked;
        applyDesignToPage();
      });
    });

    function setEditMode(enabled) {
      document.body.classList.toggle("editing", enabled);
      editBtn.textContent = enabled ? "Exit Edit Mode" : "Edit Mode";
      editBtn.classList.toggle("btn-primary", enabled);
      applyDesignToPage();
      renderAll();
    }

    editBtn.addEventListener("click", () => {
      setEditMode(!document.body.classList.contains("editing"));
    });

    function getActiveSeries() {
      const activeNum = appState.active_series_number || 1;
      appStories.series = appStories.series || [];
      let s = appStories.series.find(item => item.series_number === activeNum) || appStories.series[appStories.series.length - 1];
      if (!s) {
        s = {
          series_number: activeNum,
          series_title: appState.series_title || "Series 1",
          state: appState.state || "",
          city: appState.city || "",
          chapters: []
        };
        appStories.series.push(s);
      }
      s.chapters = s.chapters || [];
      return s;
    }

    function syncInputsFromState() {
      document.getElementById("edit-series-title").value = appState.series_title || "";
      document.getElementById("edit-city").value = appState.city || "";
      document.getElementById("edit-state").value = appState.state || "";
      document.getElementById("edit-plot-memory").value = appState.plot_memory || "";
    }

    ["edit-series-title", "edit-city", "edit-state", "edit-plot-memory"].forEach(id => {
      document.getElementById(id).addEventListener("input", () => {
        appState.series_title = document.getElementById("edit-series-title").value;
        appState.city = document.getElementById("edit-city").value;
        appState.state = document.getElementById("edit-state").value;
        appState.plot_memory = document.getElementById("edit-plot-memory").value;
        const activeSeries = getActiveSeries();
        activeSeries.series_title = appState.series_title;
        activeSeries.city = appState.city;
        activeSeries.state = appState.state;
        renderHero();
      });
    });

    function renderHero() {
      const activeSeriesNum = appState.active_series_number || 1;
      document.getElementById("series-badge").textContent = `Series ${activeSeriesNum}`;
      document.getElementById("series-title").textContent = appState.series_title || "Akshara Lokam";
      const locParts = [appState.city, appState.state].filter(Boolean);
      document.getElementById("series-location").textContent = locParts.length ? `Setting: ${locParts.join(", ")}` : "";

      const charEl = document.getElementById("character-list");
      const chars = Array.isArray(appState.characters) ? appState.characters : [];
      charEl.innerHTML = chars.map((c, idx) => {
        const label = c.name_te ? `${c.name_te} (${c.name_en || ""})` : (c.name || c.name_en || "");
        const role = c.role ? ` · ${c.role}` : "";
        return `
          <span class="char-chip">
            <span><strong>${label}</strong>${role}</span>
            <button class="chip-remove" type="button" title="Remove character" onclick="removeCharacter(${idx})">✕</button>
          </span>
        `;
      }).join("");
    }

    window.removeCharacter = function(idx) {
      appState.characters.splice(idx, 1);
      renderHero();
    };

    document.getElementById("add-char-btn").addEventListener("click", () => {
      const te = document.getElementById("new-char-te").value.trim();
      const en = document.getElementById("new-char-en").value.trim();
      const role = document.getElementById("new-char-role").value.trim();
      if (!te && !en) return;
      appState.characters = appState.characters || [];
      appState.characters.push({ name_te: te || en, name_en: en || te, role: role || "Character" });
      document.getElementById("new-char-te").value = "";
      document.getElementById("new-char-en").value = "";
      document.getElementById("new-char-role").value = "";
      renderHero();
    });

    function renderChapters() {
      const activeSeries = getActiveSeries();
      const sNum = activeSeries.series_number || appState.active_series_number || 1;
      const listEl = document.getElementById("chapter-list");
      const labelEl = document.getElementById("section-label");

      const showAll = selectedCategory === "All Stories" || selectedCategory === "All";
      labelEl.textContent = showAll ? "Published Chapters" : `${selectedCategory} Stories`;

      const indexed = activeSeries.chapters
        .map((ch, idx) => ({ ch, idx }))
        .filter(({ ch }) => showAll || (ch.category || "Drama") === selectedCategory)
        .reverse();

      if (!indexed.length) {
        listEl.innerHTML = `<div class="empty-state"><p>No stories in <strong>${selectedCategory}</strong> yet. Use <strong>+ Add Chapter</strong> in Edit Mode or select <strong>All Stories</strong>.</p></div>`;
        return;
      }

      listEl.innerHTML = indexed.map(({ ch, idx }) => {
        const cat = ch.category || "Drama";
        return `
          <article class="chapter-card">
            <a class="chapter-link" href="story.html?series=${sNum}&ch=${ch.chapter}">
              <div class="chapter-top">
                <div class="badge-group">
                  <span class="chapter-num">CHAPTER ${ch.chapter}</span>
                  <span class="cat-tag">${cat}</span>
                </div>
                <span style="font-size:0.85rem; font-weight:600; color:var(--accent);">Read chapter →</span>
              </div>
              <h3 class="chapter-title">${ch.title}</h3>
              <p class="chapter-excerpt">${ch.excerpt || ""}</p>
            </a>
            <div class="edit-controls">
              <button class="btn btn-sm" type="button" onclick="openEditChapter(${idx})">Edit Chapter</button>
              <button class="btn btn-danger btn-sm" type="button" onclick="deleteChapter(${idx})">Delete Chapter</button>
            </div>
          </article>
        `;
      }).join("");
    }

    function renderAll() {
      renderGenreSidebarAndModalOptions();
      renderHero();
      renderChapters();
    }

    const modal = document.getElementById("chapter-modal");

    document.getElementById("open-new-chapter-btn").addEventListener("click", () => {
      const activeSeries = getActiveSeries();
      editingChapterIndex = null;
      document.getElementById("modal-heading").textContent = "Add New Chapter";
      document.getElementById("m-ch-num").value = activeSeries.chapters.length + 1;
      const defaultCat = (selectedCategory === "All Stories" || selectedCategory === "All") ? "Drama" : selectedCategory;
      document.getElementById("m-ch-cat").value = defaultCat;
      document.getElementById("m-ch-title").value = "";
      document.getElementById("m-ch-excerpt").value = "";
      document.getElementById("m-ch-body").value = "";
      modal.classList.add("open");
    });

    window.openEditChapter = function(idx) {
      const activeSeries = getActiveSeries();
      const ch = activeSeries.chapters[idx];
      editingChapterIndex = idx;
      document.getElementById("modal-heading").textContent = `Edit Chapter ${ch.chapter}`;
      document.getElementById("m-ch-num").value = ch.chapter;
      document.getElementById("m-ch-cat").value = ch.category || "Drama";
      document.getElementById("m-ch-title").value = ch.title || "";
      document.getElementById("m-ch-excerpt").value = ch.excerpt || "";
      const plainParas = (ch.html_paragraphs || [])
        .map(p => p.replace(/^<p>/i, "").replace(/<\/p>$/i, "").trim())
        .join("\n\n");
      document.getElementById("m-ch-body").value = plainParas;
      modal.classList.add("open");
    };

    window.deleteChapter = function(idx) {
      const activeSeries = getActiveSeries();
      if (!confirm(`Remove Chapter ${activeSeries.chapters[idx].chapter}?`)) return;
      activeSeries.chapters.splice(idx, 1);
      appState.next_chapter = activeSeries.chapters.length + 1;
      renderChapters();
    };

    document.getElementById("m-cancel").addEventListener("click", () => modal.classList.remove("open"));

    document.getElementById("m-save").addEventListener("click", () => {
      const activeSeries = getActiveSeries();
      const num = parseInt(document.getElementById("m-ch-num").value || "1", 10);
      const category = document.getElementById("m-ch-cat").value || "Drama";
      const title = document.getElementById("m-ch-title").value.trim() || `Chapter ${num}`;
      const excerpt = document.getElementById("m-ch-excerpt").value.trim();
      const rawBody = document.getElementById("m-ch-body").value.trim();
      const html_paragraphs = rawBody
        ? rawBody.split(/\n\s*\n/).map(line => `<p>${line.trim()}</p>`)
        : ["<p></p>"];

      const entry = {
        chapter: num,
        category,
        title,
        excerpt,
        html_paragraphs,
        published_at: new Date().toISOString()
      };

      if (editingChapterIndex === null) {
        activeSeries.chapters.push(entry);
      } else {
        activeSeries.chapters[editingChapterIndex] = entry;
      }
      activeSeries.chapters.sort((a, b) => a.chapter - b.chapter);
      appState.next_chapter = activeSeries.chapters.length + 1;
      modal.classList.remove("open");
      renderChapters();
    });

    document.getElementById("download-json-btn").addEventListener("click", () => {
      [
        { name: "story_config.json", data: appConfig },
        { name: "series_state.json", data: appState },
        { name: "stories.json", data: appStories }
      ].forEach(file => {
        const blob = new Blob([JSON.stringify(file.data, null, 2)], { type: "application/json" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = file.name;
        a.click();
      });
    });

    async function commitFileToGitHub(repo, branch, token, path, contentObj, message) {
      const apiUrl = `https://api.github.com/repos/${repo}/contents/${path}?ref=${encodeURIComponent(branch)}`;
      const headers = {
        "Authorization": `Bearer ${token}`,
        "Accept": "application/vnd.github+json",
        "Content-Type": "application/json"
      };
      let sha = undefined;
      const getRes = await fetch(apiUrl, { headers });
      if (getRes.ok) {
        const meta = await getRes.json();
        sha = meta.sha;
      }
      const utf8Bytes = new TextEncoder().encode(JSON.stringify(contentObj, null, 2) + "\n");
      let binary = "";
      utf8Bytes.forEach(b => binary += String.fromCharCode(b));
      const base64Content = btoa(binary);

      const putRes = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, {
        method: "PUT",
        headers,
        body: JSON.stringify({ message, content: base64Content, branch, sha })
      });
      if (!putRes.ok) {
        const err = await putRes.text();
        throw new Error(`Failed saving ${path}: ${err}`);
      }
    }

    document.getElementById("publish-github-btn").addEventListener("click", async () => {
      const repo = document.getElementById("gh-repo").value.trim();
      const branch = document.getElementById("gh-branch").value.trim() || "main";
      const token = document.getElementById("gh-token").value.trim();
      const statusEl = document.getElementById("studio-status");

      localStorage.setItem("ak_gh_repo", repo);
      localStorage.setItem("ak_gh_branch", branch);
      if (token) localStorage.setItem("ak_gh_token", token);

      if (!token) {
        statusEl.style.color = "var(--danger)";
        statusEl.textContent = "Please paste your GitHub Token under 'GitHub Connection' (or click Download JSON Files).";
        return;
      }

      try {
        statusEl.style.color = "var(--accent)";
        statusEl.textContent = "Publishing customizer, genre & story changes to GitHub...";
        await commitFileToGitHub(repo, branch, token, "story_config.json", appConfig, "Update design & genre settings via Akshara Lokam Studio");
        await commitFileToGitHub(repo, branch, token, "series_state.json", appState, "Update series_state.json via Akshara Lokam Studio");
        await commitFileToGitHub(repo, branch, token, "stories.json", appStories, "Update stories.json via Akshara Lokam Studio");
        statusEl.style.color = "var(--success)";
        statusEl.textContent = "Saved to GitHub! GitHub Pages will update in ~30–60 seconds.";
      } catch (err) {
        statusEl.style.color = "var(--danger)";
        statusEl.textContent = err.message;
      }
    });

    async function init() {
      try {
        const urlCat = new URLSearchParams(window.location.search).get("category");
        if (urlCat) {
          selectedCategory = urlCat;
        }

        const cacheBust = `?t=${Date.now()}`;
        const [configRes, stateRes, storiesRes] = await Promise.all([
          fetch("story_config.json" + cacheBust),
          fetch("series_state.json" + cacheBust),
          fetch("stories.json" + cacheBust)
        ]);
        appConfig = configRes.ok ? await configRes.json() : {};
        appState = stateRes.ok ? await stateRes.json() : {};
        appStories = storiesRes.ok ? await storiesRes.json() : { series: [] };

        ensureCustomDesign();
        applyDesignToPage();
        syncCustomizerInputs();
        syncInputsFromState();
        renderAll();

        if (new URLSearchParams(window.location.search).get("edit") === "1") {
          setEditMode(true);
        }
      } catch (err) {
        document.getElementById("chapter-list").innerHTML =
          `<div class="empty-state"><p>Unable to load chapters right now.</p></div>`;
      }
    }
    init();
  </script>
</body>
</html>
