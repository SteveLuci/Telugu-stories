<!DOCTYPE html>
<html lang="te" data-theme="sepia">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Akshara Lokam — అక్షర లోకం</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,700;1,6..72,500&family=Noto+Sans+Telugu:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f7f1e5;
      --bg-grad: radial-gradient(circle at top right, rgba(168, 76, 36, 0.08), transparent 45%),
                 radial-gradient(circle at bottom left, rgba(180, 120, 50, 0.08), transparent 45%);
      --surface: #fffdf8;
      --surface-alt: #f0e5d1;
      --text: #241c14;
      --muted: #685848;
      --accent: #9a3b1b;
      --accent-soft: rgba(154, 59, 27, 0.1);
      --border: rgba(110, 72, 42, 0.16);
      --shadow: 0 10px 30px rgba(45, 26, 10, 0.06);
    }

    [data-theme="dark"] {
      --bg: #111215;
      --bg-grad: radial-gradient(circle at top right, rgba(224, 159, 103, 0.08), transparent 45%),
                 radial-gradient(circle at bottom left, rgba(130, 95, 65, 0.08), transparent 45%);
      --surface: #181a1f;
      --surface-alt: #20232a;
      --text: #f0ece4;
      --muted: #a69f93;
      --accent: #e59d5c;
      --accent-soft: rgba(229, 157, 92, 0.14);
      --border: rgba(255, 255, 255, 0.1);
      --shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Noto Sans Telugu", "Plus Jakarta Sans", sans-serif;
      background-color: var(--bg);
      background-image: var(--bg-grad);
      color: var(--text);
      line-height: 1.85;
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      max-width: 840px;
      margin: 0 auto;
      padding: 2rem 1.25rem 4rem;
    }

    .top-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--border);
    }

    .brand-eyebrow {
      font-family: "Plus Jakarta Sans", sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 700;
      margin-bottom: 0.25rem;
    }

    .site-title {
      margin: 0;
      font-family: "Newsreader", "Noto Sans Telugu", serif;
      font-size: clamp(1.85rem, 4vw, 2.5rem);
      line-height: 1.2;
      font-weight: 700;
    }

    .nav-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem 1.1rem;
      margin: 1.15rem 0 1.75rem;
    }

    .nav-group a {
      color: var(--muted);
      text-decoration: none;
      font-family: "Plus Jakarta Sans", "Noto Sans Telugu", sans-serif;
      font-size: 0.92rem;
      font-weight: 600;
      padding: 0.25rem 0;
      border-bottom: 2px solid transparent;
      transition: color 0.2s ease, border-color 0.2s ease;
    }

    .nav-group a:hover,
    .nav-group a.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .theme-btn {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.5rem 0.95rem;
      border-radius: 999px;
      font-family: "Plus Jakarta Sans", sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: transform 0.15s ease, border-color 0.2s ease;
    }

    .theme-btn:hover {
      transform: translateY(-1px);
      border-color: var(--accent);
    }

    .hero-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem 1.65rem;
      box-shadow: var(--shadow);
      margin-bottom: 2rem;
    }

    .series-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 0.82rem;
      font-weight: 700;
      padding: 0.28rem 0.75rem;
      border-radius: 999px;
      margin-bottom: 0.75rem;
    }

    .series-heading {
      margin: 0 0 0.4rem;
      font-size: clamp(1.3rem, 3vw, 1.7rem);
      font-weight: 700;
      line-height: 1.4;
    }

    .series-location {
      color: var(--muted);
      font-size: 0.95rem;
      margin: 0 0 1rem;
    }

    .char-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.75rem;
    }

    .char-chip {
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.35rem 0.7rem;
      font-size: 0.85rem;
      color: var(--text);
    }

    .section-label {
      font-family: "Plus Jakarta Sans", "Noto Sans Telugu", sans-serif;
      font-size: 0.82rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 0.9rem;
    }

    .chapter-card {
      display: block;
      text-decoration: none;
      color: inherit;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.35rem 1.5rem;
      margin-bottom: 1rem;
      box-shadow: var(--shadow);
      transition: transform 0.18s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .chapter-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }

    .chapter-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.45rem;
    }

    .chapter-num {
      font-family: "Plus Jakarta Sans", sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 0.2rem 0.65rem;
      border-radius: 6px;
    }

    .read-link {
      font-family: "Plus Jakarta Sans", sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--accent);
    }

    .chapter-title {
      margin: 0.25rem 0 0.5rem;
      font-size: 1.22rem;
      font-weight: 700;
      line-height: 1.5;
    }

    .chapter-excerpt {
      margin: 0;
      color: var(--muted);
      font-size: 0.98rem;
    }

    .empty-state {
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: 14px;
      padding: 2rem;
      text-align: center;
      color: var(--muted);
    }

    footer {
      margin-top: 3.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      font-size: 0.9rem;
      color: var(--muted);
    }

    footer a {
      color: var(--muted);
      text-decoration: none;
      margin-left: 1rem;
      font-weight: 600;
    }

    footer a:hover {
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top-bar">
      <div>
        <div class="brand-eyebrow">Daily Telugu Serial Fiction</div>
        <h1 id="site-title" class="site-title">Akshara Lokam</h1>
      </div>
      <button id="theme-toggle" class="theme-btn" type="button">Dark Mode</button>
    </div>

    <nav class="nav-group" aria-label="Main navigation">
      <a class="active" href="index.html">Chapters</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      <a href="privacy.html">Privacy Policy</a>
    </nav>

    <!-- AdSense responsive slot placeholder -->
    <div id="ad-slot-top"></div>

    <section class="hero-card" aria-live="polite">
      <div id="series-badge" class="series-pill">Series 1</div>
      <h2 id="series-title" class="series-heading">Loading series...</h2>
      <p id="series-location" class="series-location"></p>
      <div id="character-list" class="char-chips"></div>
    </section>

    <div class="section-label">Published Chapters</div>
    <main id="chapter-list"></main>

    <footer>
      <span>&copy; Akshara Lokam</span>
      <div>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="privacy.html">Privacy Policy</a>
      </div>
    </footer>
  </div>

  <script>
    const root = document.documentElement;
    const toggleBtn = document.getElementById("theme-toggle");
    const savedTheme = localStorage.getItem("theme") || "sepia";
    root.setAttribute("data-theme", savedTheme);
    toggleBtn.textContent = savedTheme === "dark" ? "Sepia Mode" : "Dark Mode";

    toggleBtn.addEventListener("click", () => {
      const next = root.getAttribute("data-theme") === "dark" ? "sepia" : "dark";
      root.setAttribute("data-theme", next);
      localStorage.setItem("theme", next);
      toggleBtn.textContent = next === "dark" ? "Sepia Mode" : "Dark Mode";
    });

    async function loadChapters() {
      try {
        const [configRes, stateRes, storiesRes] = await Promise.all([
          fetch("story_config.json"),
          fetch("series_state.json"),
          fetch("stories.json")
        ]);
        const config = configRes.ok ? await configRes.json() : {};
        const state = stateRes.ok ? await stateRes.json() : {};
        const stories = storiesRes.ok ? await storiesRes.json() : {};

        if (config.site_title) {
          document.title = `${config.site_title} — అక్షర లోకం`;
          document.getElementById("site-title").textContent = config.site_title;
        }

        const activeSeriesNum = state.active_series_number || 1;
        document.getElementById("series-badge").textContent = `Series ${activeSeriesNum}`;
        document.getElementById("series-title").textContent = state.series_title || "Akshara Lokam";

        const locParts = [state.city, state.state].filter(Boolean);
        document.getElementById("series-location").textContent =
          locParts.length ? `Setting: ${locParts.join(", ")}` : "";

        const charEl = document.getElementById("character-list");
        const chars = Array.isArray(state.characters) ? state.characters : [];
        if (chars.length) {
          charEl.innerHTML = chars.map(c => {
            const label = c.name_te ? `${c.name_te} (${c.name_en || ""})` : (c.name || c.name_en || "");
            const role = c.role ? ` · ${c.role}` : "";
            return `<span class="char-chip"><strong>${label}</strong>${role}</span>`;
          }).join("");
        }

        const seriesList = stories.series || [];
        const activeSeries =
          seriesList.find(s => s.series_number === activeSeriesNum) ||
          seriesList[seriesList.length - 1] ||
          { chapters: [] };

        const chapters = [...(activeSeries.chapters || [])].reverse();
        const listEl = document.getElementById("chapter-list");

        if (!chapters.length) {
          listEl.innerHTML = `<div class="empty-state"><p>First chapter arrives at 7:00 AM daily.</p></div>`;
          return;
        }

        const sNum = activeSeries.series_number || activeSeriesNum;
        listEl.innerHTML = chapters.map(ch => `
          <a class="chapter-card" href="story.html?series=${sNum}&ch=${ch.chapter}">
            <div class="chapter-top">
              <span class="chapter-num">CHAPTER ${ch.chapter}</span>
              <span class="read-link">Read chapter →</span>
            </div>
            <h3 class="chapter-title">${ch.title}</h3>
            <p class="chapter-excerpt">${ch.excerpt || ""}</p>
          </a>
        `).join("");
      } catch (err) {
        document.getElementById("chapter-list").innerHTML =
          `<div class="empty-state"><p>Unable to load chapters right now.</p></div>`;
      }
    }
    loadChapters();
  </script>
</body>
</html>
